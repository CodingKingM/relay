services:
  db:
    image: postgres:16
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay-backend:
    build: ./relay-backend
    container_name: relay-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/relay
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-localpassword}
      COOKIE_SECURE: false

  relay-frontend:
    build:
      context: ./relay-frontend
      args:
        - API_URL=${VITE_API_URL:-http://localhost:8080/api}
    container_name: relay-frontend
    restart: always
    depends_on:
      - relay-backend
    ports:
      - "80:80"

volumes:
  postgres_data:
